plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {

    testImplementation 'io.rest-assured:rest-assured:6.0.0'
    testImplementation 'io.rest-assured:json-path:6.0.0'
    testImplementation 'io.rest-assured:json-schema-validator:6.0.0'

    // Declared explicitly because OrderResponse directly imports Jackson's
    // annotation API; previously resolved only as an incidental transitive
    // dependency of json-schema-validator. Version matches what already
    // resolves on the classpath (no upgrade).
    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.11.0'

    testImplementation 'org.testng:testng:7.12.0'

    testImplementation 'io.qameta.allure:allure-testng:2.32.0'
    testImplementation 'io.qameta.allure:allure-rest-assured:2.32.0'
}

def isWindows = System.getProperty("os.name").toLowerCase().contains("win")
def allureResultsDir = layout.buildDirectory.dir("allure-results").get().asFile
def allureReportDir = layout.buildDirectory.dir("allure-report").get().asFile

println "allureResultsDir: $allureResultsDir"
println "allureReportDir: $allureReportDir"

def isAllureCommandlineAvailable = {
    try {
        def checkCommand = isWindows ? ["cmd", "/c", "where", "allure"] : ["which", "allure"]
        def process = checkCommand.execute()
        process.waitFor()
        return process.exitValue() == 0
    } catch (Exception ignored) {
        return false
    }
}

tasks.register('generateSingleAllureHtml', Exec) {
    group = "reporting"
    description = "Generates single-file Allure HTML report (skipped if Allure Commandline is not installed)"

    onlyIf {
        def available = isAllureCommandlineAvailable()
        if (!available) {
            logger.warn("Allure Commandline not found on PATH — skipping Allure HTML report generation. " +
                    "Install Allure Commandline to enable this step.")
        }
        available
    }

    commandLine = isWindows ?
            ["cmd", "/c", "allure", "generate",
             allureResultsDir.absolutePath,
             "--clean",
             "-o",
             allureReportDir.absolutePath,
             "--single-file"]
            :
            ["allure", "generate",
             allureResultsDir.absolutePath,
             "--clean",
             "-o",
             allureReportDir.absolutePath,
             "--single-file"]

    doLast {
        def report = new File(allureReportDir, "index.html")
        if (report.exists()) {
            report.renameTo(new File(allureReportDir, "GroceryStore-ApiAutomationReport.html"))
        }
    }
}


test {

    useTestNG()

    // Optional suite execution
    if (project.hasProperty('suite')) {
        useTestNG {
            suites "src/test/resources/testng-${project.suite}.xml"
        }
    }

    systemProperty "allure.results.directory",
            layout.buildDirectory.dir("allure-results").get().asFile.absolutePath

    systemProperty "env", System.getProperty("env", "dev")

    finalizedBy tasks.generateSingleAllureHtml
}